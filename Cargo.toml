[package]
name = "mem8"
version = "0.1.0"
edition = "2021"
# `Option::is_none_or`, used by the store filter predicates, stabilised in
# 1.82. Declared so an older toolchain reports an unmet MSRV instead of a
# confusing "no method named `is_none_or`".
rust-version = "1.82"
description = "Persistent, project-scoped memory for AI coding agents, served over the Model Context Protocol."
license = "MIT"
repository = "https://github.com/rinnguyen711/mem8"
readme = "README.md"
keywords = ["mcp", "memory", "agent", "sqlite", "postgres"]
categories = ["command-line-utilities", "database"]

[lib]
name = "mem8"
path = "src/lib.rs"

[[bin]]
name = "mem8"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "0.9", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
dirs = "5"

# Semantic search. Optional: fastembed bundles an ONNX runtime and grows the
# binary by roughly an order of magnitude, so users who only want keyword
# search should not carry it.
# `default-features = false` to drop fastembed's native-tls default, which
# pulls in openssl-sys and so requires OpenSSL headers and pkg-config to build.
# rustls needs no C library, which keeps the container image free of a system
# TLS dependency and makes cross-building predictable.
#
# `image-models` is part of the default set and is not restored here: mem8
# embeds text only.
fastembed = { version = "6", optional = true, default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
pgvector = { version = "0.4", features = ["sqlx"], optional = true }

# Remote serving over HTTP. Optional: stdio is the default transport and needs
# no web server, no TLS stack, and no auth.
axum = { version = "0.8", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
tower = { version = "0.5", optional = true }
# Constant-time token comparison. A byte-by-byte `==` returns early on the
# first mismatch, which leaks the token's prefix through response timing.
# Not optional: the comparison must not silently become variable-time depending
# on which features a build happens to enable, and the crate is tiny.
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mem8 = { path = ".", features = ["test-support"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
# An HTTP client for the transport tests. rustls rather than the system TLS
# stack, so the suite builds without OpenSSL headers.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
# The migration suite hand-writes a v1 database, which needs the same SQLite
# bindings the store uses. A normal dependency is not visible to integration
# test targets, so it is repeated here with matching version and features.
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
test-support = []
# Off by default: keyword search is the baseline experience and must not
# require a 100 MB binary.
semantic = ["dep:fastembed", "dep:pgvector"]

# Serve over HTTP instead of stdio, for running mem8 as a shared service.
# Off by default: the local agent-spawns-a-child shape needs none of it.
http = [
    "dep:axum",
    "dep:axum-server",
    "dep:tower",
    "rmcp/transport-streamable-http-server",
]
